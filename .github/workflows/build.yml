name: Build — daily publish (cron + manual)

on:
  schedule:
    - cron: "0 3 * * *"      # 03:00 UTC — see memory/design-decisions.md
  workflow_dispatch:
    inputs:
      images:
        description: >-
          Which image(s) to rebuild + publish. Accepts "all" (default),
          an exact dir name (e.g. "beaconry-hub"), a comma list
          ("a,b,c"), or a shell glob ("prometheus-*", "*-scratch-trixie").
          FG-057. Daily cron ignores this input.
        type: string
        required: false
        default: 'all'

permissions:
  contents: read
  packages: write            # push to ghcr.io
  id-token: write            # OIDC token for keyless cosign signing

jobs:

  # FG-025 + FG-042 + FG-046 + FG-048 + FG-051 + FG-058 + FG-061 + FG-065 + FG-072: four-tier publish.
  # 1. pre-builders (debian-slim-trixie + debian-slim-sid + python-slim-trixie
  #    + ubuntu-slim-noble + node-slim-trixie + go-slim-trixie + zig-slim-trixie)
  #    — forge-rooted slim bases that forge-builder-python-trixie + cadvisor-
  #    slim + ipmi-exporter-slim + github-runner-noble + uptime-kuma-slim +
  #    forge-builder-{go,node,zig}-trixie FROM. Publish first so downstream has
  #    a resolvable forge-signed FROM.
  #    debian-slim-sid has zero consumers today; it's escape-hatch infra.
  #    node-slim-trixie is FG-061's Node runtime base; uptime-kuma-slim-trixie
  #    runtime migrates onto it (prev FROMed node:24-trixie-slim directly).
  #    go-slim-trixie is FG-065's Go toolchain base; forge-builder-go-trixie
  #    dogfoods it (satisfying the FG-065 arch.language-family-image-pair
  #    invariant — every language ships a <lang>-slim-trixie + forge-builder-
  #    <lang>-trixie pair, with the builder dogfooding the pre-builder).
  #    zig-slim-trixie is FG-072's Zig toolchain base; forge-builder-zig-trixie
  #    dogfoods it. Zig has no Debian-based Docker Hub upstream, so zig-slim-
  #    trixie necessarily FROMs debian-slim-trixie (narrow Rule 6 intra-layer
  #    exemption; preserves FG-042 single-upstream-consumer rule).
  # 2. builders (forge-builder-python-trixie + forge-builder-go-trixie +
  #    forge-builder-node-trixie + forge-builder-zig-trixie) — shared builder-
  #    stage images. forge-builder-python-trixie FROMs python-slim-trixie
  #    (dogfood) so needs pre-builders first. All four forge-builders dogfood
  #    their respective pre-builders per FG-065 arch.language-family-image-pair
  #    (FG-072 extends from 3 → 4 satisfying language families).
  # 3. base (base/scratch-trixie + base/python-trixie — L3 per FG-069; plus
  #    leaf images) — publish in parallel.
  # 4. derivatives (scratch image variants, beaconry hub/scout) — FROM bases.
  discover:
    name: Discover image dirs
    runs-on: ubuntu-latest
    # FG-038: 5-min cap (typical 10s — discover-images.sh over images/).
    timeout-minutes: 5
    outputs:
      mirrors: ${{ steps.disc.outputs.mirrors }}
      pre_builders: ${{ steps.disc.outputs.pre_builders }}
      builders: ${{ steps.disc.outputs.builders }}
      base: ${{ steps.disc.outputs.base }}
      derivatives: ${{ steps.disc.outputs.derivatives }}
    steps:
      - uses: actions/checkout@v7
      - id: disc
        env:
          # FG-057: workflow_dispatch may pass `images=<name|csv|glob>`.
          # Scheduled cron carries no inputs, so default to "all".
          FILTER: ${{ inputs.images || 'all' }}
        run: |
          {
            echo "mirrors=$(bash scripts/discover-images.sh mirrors --filter "${FILTER}" | jq -c .)"
            echo "pre_builders=$(bash scripts/discover-images.sh pre-builders --filter "${FILTER}" | jq -c .)"
            echo "builders=$(bash scripts/discover-images.sh builders --filter "${FILTER}" | jq -c .)"
            echo "base=$(bash scripts/discover-images.sh base --filter "${FILTER}" | jq -c .)"
            echo "derivatives=$(bash scripts/discover-images.sh derivatives --filter "${FILTER}" | jq -c .)"
          } >> "$GITHUB_OUTPUT"

  # FG-066: publish-mirrors tier — zero-mod forge-signed passthroughs of
  # external tool images (first member: mirror/syft). Runs in PARALLEL
  # with publish-pre-builders (no mutual dependency). Both block
  # publish-builders because the builders FROM their respective pre-
  # builders AND COPY --from=mirror/syft for the syft binary.
  publish-mirrors:
    name: Publish ${{ matrix.image_dir }}
    needs: discover
    if: ${{ !cancelled() && fromJSON(needs.discover.outputs.mirrors).include[0] != null }}
    runs-on: ubuntu-latest
    # FG-038: 10-min cap per mirror. Typical < 1 min (pure passthrough + labels).
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.mirrors) }}
    env:
      REGISTRY: ghcr.io/bboortz
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Current UTC day (for grype DB cache key)
        id: dt
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cache grype DB
        uses: actions/cache@v6
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: ~/.cache/grype
          key: grype-db-${{ runner.os }}-${{ steps.dt.outputs.day }}
          restore-keys: |
            grype-db-${{ runner.os }}-
      - name: Install syft + grype + cosign (v2.6.5 pinned — review by 2027-05-17)
        run: |
          mkdir -p "$HOME/.local/bin"
          bash scripts/install-tool-from-docker.sh anchore/syft:latest  /syft  "$HOME/.local/bin/syft"
          bash scripts/install-tool-from-docker.sh anchore/grype:latest /grype "$HOME/.local/bin/grype"
          bash scripts/install-tool-from-docker.sh gcr.io/projectsigstore/cosign:v2.6.5 /ko-app/cosign "$HOME/.local/bin/cosign"
          chmod +x "$HOME/.local/bin/cosign"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Login to GHCR for cache pull/push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push
        env:
          FORGE_CACHE_FROM_PREFIX: ghcr.io/bboortz
          FORGE_CACHE_PUSH: "1"
        run: |
          bash scripts/build-image.sh "${{ matrix.image_dir }}"
          docker tag "${REGISTRY}/${{ matrix.repo }}:${{ matrix.tag }}" "${REGISTRY}/${{ matrix.repo }}:latest"
          docker push "${REGISTRY}/${{ matrix.repo }}:${{ matrix.tag }}"
          docker push "${REGISTRY}/${{ matrix.repo }}:latest"
      - name: Scan + sign + attest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${REGISTRY}/${{ matrix.repo }}:${{ matrix.tag }}" | awk -F@ '{print $2}')
          REF_BY_DIGEST="${REGISTRY}/${{ matrix.repo }}@${DIGEST}"
          cosign sign --yes "${REF_BY_DIGEST}"
          syft scan "${REF_BY_DIGEST}" -o cyclonedx-json > /tmp/sbom.json
          grype "${REF_BY_DIGEST}" -o json > /tmp/scan.json || true
          cosign attest --yes --predicate /tmp/sbom.json --type cyclonedx "${REF_BY_DIGEST}"
          cosign attest --yes --predicate /tmp/scan.json --type vuln "${REF_BY_DIGEST}"

  # FG-042 + FG-051 + FG-058 + FG-061 + FG-065 + FG-072: pre-builders tier —
  # forge-rooted slim bases (debian-slim-trixie, debian-slim-sid,
  # go-slim-trixie, node-slim-trixie, python-slim-trixie, ubuntu-slim-noble,
  # zig-slim-trixie). Must publish BEFORE publish-builders because all four
  # forge-builder-*-trixie images now dogfood their respective pre-builders
  # (FG-042 python, FG-065 node + go, FG-072 zig) and downstream runtime
  # images FROM the Debian + Ubuntu + Node pre-builders.
  publish-pre-builders:
    name: Publish ${{ matrix.image_dir }}
    needs: discover
    # FG-057: when the filter skips this tier entirely (empty matrix), the
    # job is marked `skipped` which would normally cascade-fail downstream
    # tiers' `needs:`. Make this job explicitly succeed-when-empty so the
    # chain stays happy. `contains()` checks for 'image_dir' which exists
    # IFF the matrix has at least one entry — more robust than string-
    # equality against '{"include":[]}' (which trips on whitespace / \n).
    if: ${{ !cancelled() && fromJSON(needs.discover.outputs.pre_builders).include[0] != null }}
    runs-on: ubuntu-latest
    # FG-038: 10-min cap per pre-builder. Typical 2-4 min (apt-upgrade + push).
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.pre_builders) }}
    env:
      REGISTRY: ghcr.io/bboortz
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Current UTC day (for grype DB cache key)
        id: dt
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cache grype DB
        uses: actions/cache@v6
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: ~/.cache/grype
          key: grype-db-${{ runner.os }}-${{ steps.dt.outputs.day }}
          restore-keys: |
            grype-db-${{ runner.os }}-
      - name: Install syft + grype + cosign (v2.6.5 pinned — review by 2027-05-17)
        run: |
          mkdir -p "$HOME/.local/bin"
          bash scripts/install-tool-from-docker.sh anchore/syft:latest  /syft  "$HOME/.local/bin/syft"
          bash scripts/install-tool-from-docker.sh anchore/grype:latest /grype "$HOME/.local/bin/grype"
          bash scripts/install-tool-from-docker.sh gcr.io/projectsigstore/cosign:v2.6.5 /ko-app/cosign "$HOME/.local/bin/cosign"
          chmod +x "$HOME/.local/bin/cosign"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        env:
          IMAGE_DIR: ${{ matrix.image_dir }}
          FORGE_CACHE_FROM_PREFIX: ghcr.io/bboortz
          FORGE_CACHE_PUSH: '1'
          # FG-048 follow-up: authenticated GitHub API for build.ref-latest-
          # release curl calls. Shared GHA runner IPs exhaust the 60/hr
          # unauthenticated cap during parallel matrix publish; the authed
          # cap is 5000/hr. Fixes 2026-11-14 run 43613702946 flake.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: REGISTRY="$REGISTRY" bash scripts/build-image.sh "$IMAGE_DIR"
      - name: Scan + SBOM
        env:
          IMAGE_DIR: ${{ matrix.image_dir }}
        run: make scan IMAGE_DIR="$IMAGE_DIR" REGISTRY="$REGISTRY"
      - name: Push image (4 tags per variant — FG-004)
        id: push
        env:
          REPO: ${{ matrix.repo }}
          TAG: ${{ matrix.tag }}
          ARCH: amd64
        run: |
          IMAGE_REF="${REGISTRY}/${REPO}:${TAG}"
          docker push "${IMAGE_REF}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_REF}" | sed 's/.*@//')
          for extra in "${TAG}-${ARCH}" "latest" "latest-${ARCH}"; do
            docker tag  "${IMAGE_REF}" "${REGISTRY}/${REPO}:${extra}"
            docker push "${REGISTRY}/${REPO}:${extra}"
          done
          echo "image_digest=${REGISTRY}/${REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: cosign sign (keyless)
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
        run: cosign sign --yes "$IMAGE_DIGEST"
      - name: cosign attest — CycloneDX SBOM
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
          SBOM: build/${{ matrix.safe_name }}-${{ matrix.tag }}.sbom.json
        run: cosign attest --yes --predicate "$SBOM" --type cyclonedx "$IMAGE_DIGEST"
      - name: cosign attest — grype vuln scan
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
          GRYPE: build/${{ matrix.safe_name }}-${{ matrix.tag }}.grype.json
        run: cosign attest --yes --predicate "$GRYPE" --type vuln "$IMAGE_DIGEST"
      - name: Publish-time verify
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/bboortz/forge/.github/workflows/build.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_DIGEST"
      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.safe_name }}-${{ matrix.tag }}
          path: build/
          retention-days: 30

  publish-builders:
    name: Publish ${{ matrix.image_dir }}
    needs: [discover, publish-pre-builders, publish-mirrors]
    # FG-057: run if this tier has content AND the upstream tier either
    # ran successfully (standard cron) OR was intentionally skipped by
    # the filter (so an empty pre-builders tier doesn't cascade-skip us).
    # FG-066: publish-mirrors is a parallel sibling — same success-or-
    # skipped gate so the chain doesn't cascade-skip from an empty mirrors tier.
    if: ${{ !cancelled() && fromJSON(needs.discover.outputs.builders).include[0] != null && (needs.publish-pre-builders.result == 'success' || needs.publish-pre-builders.result == 'skipped') && (needs.publish-mirrors.result == 'success' || needs.publish-mirrors.result == 'skipped') }}
    runs-on: ubuntu-latest
    # FG-038: 10-min cap per builder image. Typical 3-5 min (apt-upgrade
    # + syft install + push). ~2× worst-case typical.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.builders) }}
    env:
      REGISTRY: ghcr.io/bboortz
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Current UTC day (for grype DB cache key)
        id: dt
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cache grype DB
        uses: actions/cache@v6
        # FG-038: 3-min cap + continue-on-error — cache action hangs on
        # GHA service slowness should fail fast; grype re-downloads DB.
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: ~/.cache/grype
          key: grype-db-${{ runner.os }}-${{ steps.dt.outputs.day }}
          restore-keys: |
            grype-db-${{ runner.os }}-
      - name: Install syft + grype + cosign (v2.6.5 pinned — review by 2027-05-17)
        run: |
          # syft + grype via Docker Hub (GitHub release CDN flaps 504s; Docker Hub is separate).
          mkdir -p "$HOME/.local/bin"
          bash scripts/install-tool-from-docker.sh anchore/syft:latest  /syft  "$HOME/.local/bin/syft"
          bash scripts/install-tool-from-docker.sh anchore/grype:latest /grype "$HOME/.local/bin/grype"
          # cosign from the Sigstore project's gcr.io image (v2.6.5 pinned).
          bash scripts/install-tool-from-docker.sh gcr.io/projectsigstore/cosign:v2.6.5 /ko-app/cosign "$HOME/.local/bin/cosign"
          chmod +x "$HOME/.local/bin/cosign"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        env:
          IMAGE_DIR: ${{ matrix.image_dir }}
          FORGE_CACHE_FROM_PREFIX: ghcr.io/bboortz
          FORGE_CACHE_PUSH: '1'
          # FG-048 follow-up: authenticated GitHub API for build.ref-latest-
          # release curl calls. Shared GHA runner IPs exhaust the 60/hr
          # unauthenticated cap during parallel matrix publish; the authed
          # cap is 5000/hr. Fixes 2026-11-14 run 43613702946 flake.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: REGISTRY="$REGISTRY" bash scripts/build-image.sh "$IMAGE_DIR"
      - name: Scan + SBOM
        env:
          IMAGE_DIR: ${{ matrix.image_dir }}
        run: make scan IMAGE_DIR="$IMAGE_DIR" REGISTRY="$REGISTRY"
      - name: Push image (4 tags per variant — FG-004)
        id: push
        env:
          REPO: ${{ matrix.repo }}
          TAG: ${{ matrix.tag }}
          ARCH: amd64
        run: |
          IMAGE_REF="${REGISTRY}/${REPO}:${TAG}"
          docker push "${IMAGE_REF}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_REF}" | sed 's/.*@//')
          for extra in "${TAG}-${ARCH}" "latest" "latest-${ARCH}"; do
            docker tag  "${IMAGE_REF}" "${REGISTRY}/${REPO}:${extra}"
            docker push "${REGISTRY}/${REPO}:${extra}"
          done
          echo "image_digest=${REGISTRY}/${REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: cosign sign (keyless)
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
        run: cosign sign --yes "$IMAGE_DIGEST"
      - name: cosign attest — CycloneDX SBOM
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
          SBOM: build/${{ matrix.safe_name }}-${{ matrix.tag }}.sbom.json
        run: cosign attest --yes --predicate "$SBOM" --type cyclonedx "$IMAGE_DIGEST"
      - name: cosign attest — grype vuln scan
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
          GRYPE: build/${{ matrix.safe_name }}-${{ matrix.tag }}.grype.json
        run: cosign attest --yes --predicate "$GRYPE" --type vuln "$IMAGE_DIGEST"
      - name: Publish-time verify
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/bboortz/forge/.github/workflows/build.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_DIGEST"
      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.safe_name }}-${{ matrix.tag }}
          path: build/
          retention-days: 30

  publish-base:
    name: Publish ${{ matrix.image_dir }}
    needs: [discover, publish-builders]
    # FG-057: allow intentional skips in the upstream tier.
    if: ${{ !cancelled() && fromJSON(needs.discover.outputs.base).include[0] != null && (needs.publish-builders.result == 'success' || needs.publish-builders.result == 'skipped') }}
    runs-on: ubuntu-latest
    # FG-038: 10-min cap per scratch-base image (same cadence as builders).
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.base) }}
    env:
      REGISTRY: ghcr.io/bboortz
    steps:
      - uses: actions/checkout@v7
      # FG-021: buildx + GHCR cache.
      - uses: docker/setup-buildx-action@v3
      - name: Current UTC day (for grype DB cache key)
        id: dt
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # FG-022: cache grype CVE DB.
      - name: Cache grype DB
        uses: actions/cache@v6
        # FG-038: 3-min cap + continue-on-error — cache action hangs on
        # GHA service slowness should fail fast; grype re-downloads DB.
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: ~/.cache/grype
          key: grype-db-${{ runner.os }}-${{ steps.dt.outputs.day }}
          restore-keys: |
            grype-db-${{ runner.os }}-
      - name: Install syft + grype + cosign (v2.6.5 pinned — review by 2027-05-17)
        run: |
          # syft + grype via Docker Hub (GitHub release CDN flaps 504s; Docker Hub is separate).
          mkdir -p "$HOME/.local/bin"
          bash scripts/install-tool-from-docker.sh anchore/syft:latest  /syft  "$HOME/.local/bin/syft"
          bash scripts/install-tool-from-docker.sh anchore/grype:latest /grype "$HOME/.local/bin/grype"
          # cosign from the Sigstore project's gcr.io image (v2.6.5 pinned).
          bash scripts/install-tool-from-docker.sh gcr.io/projectsigstore/cosign:v2.6.5 /ko-app/cosign "$HOME/.local/bin/cosign"
          chmod +x "$HOME/.local/bin/cosign"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        env:
          IMAGE_DIR: ${{ matrix.image_dir }}
          # FG-021: push cache from the daily cron (trusted event).
          FORGE_CACHE_FROM_PREFIX: ghcr.io/bboortz
          FORGE_CACHE_PUSH: '1'
          # FG-048 follow-up: authenticated GitHub API for build.ref-latest-
          # release curl calls. Shared GHA runner IPs exhaust the 60/hr
          # unauthenticated cap during parallel matrix publish; the authed
          # cap is 5000/hr. Fixes 2026-11-14 run 43613702946 flake.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: REGISTRY="$REGISTRY" bash scripts/build-image.sh "$IMAGE_DIR"
      - name: Scan + SBOM
        env:
          IMAGE_DIR: ${{ matrix.image_dir }}
        run: make scan IMAGE_DIR="$IMAGE_DIR" REGISTRY="$REGISTRY"
      - name: Push image (4 tags per variant — FG-004)
        id: push
        env:
          REPO: ${{ matrix.repo }}
          TAG: ${{ matrix.tag }}
          ARCH: amd64
        run: |
          IMAGE_REF="${REGISTRY}/${REPO}:${TAG}"
          docker push "${IMAGE_REF}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_REF}" | sed 's/.*@//')
          for extra in "${TAG}-${ARCH}" "latest" "latest-${ARCH}"; do
            docker tag  "${IMAGE_REF}" "${REGISTRY}/${REPO}:${extra}"
            docker push "${REGISTRY}/${REPO}:${extra}"
          done
          echo "image_digest=${REGISTRY}/${REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: cosign sign (keyless)
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
        run: cosign sign --yes "$IMAGE_DIGEST"
      - name: cosign attest — CycloneDX SBOM
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
          SBOM: build/${{ matrix.safe_name }}-${{ matrix.tag }}.sbom.json
        run: cosign attest --yes --predicate "$SBOM" --type cyclonedx "$IMAGE_DIGEST"
      - name: cosign attest — grype vuln scan
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
          GRYPE: build/${{ matrix.safe_name }}-${{ matrix.tag }}.grype.json
        run: cosign attest --yes --predicate "$GRYPE" --type vuln "$IMAGE_DIGEST"
      - name: Publish-time verify
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/bboortz/forge/.github/workflows/build.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_DIGEST"
      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.safe_name }}-${{ matrix.tag }}
          path: build/
          retention-days: 30

  publish-derivatives:
    name: Publish ${{ matrix.image_dir }}
    needs: [discover, publish-base]
    # FG-057: allow intentional skips in the upstream tier.
    if: ${{ !cancelled() && fromJSON(needs.discover.outputs.derivatives).include[0] != null && (needs.publish-base.result == 'success' || needs.publish-base.result == 'skipped') }}
    runs-on: ubuntu-latest
    # FG-038: 16-min cap per derivative image. Typical 5-8 min (apt
    # install + syft + overlay + cosign sign + push + attestations).
    # Externally-sourced images (beaconry-*) add clone time. ~2× worst.
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.derivatives) }}
    env:
      REGISTRY: ghcr.io/bboortz
    steps:
      - uses: actions/checkout@v7
      # FG-021 + FG-022: same cache setup as publish-base.
      - uses: docker/setup-buildx-action@v3
      - name: Current UTC day
        id: dt
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cache grype DB
        uses: actions/cache@v6
        # FG-038: 3-min cap + continue-on-error — cache action hangs on
        # GHA service slowness should fail fast; grype re-downloads DB.
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: ~/.cache/grype
          key: grype-db-${{ runner.os }}-${{ steps.dt.outputs.day }}
          restore-keys: |
            grype-db-${{ runner.os }}-
      - name: Install syft + grype + cosign (v2.6.5 pinned — review by 2027-05-17)
        run: |
          # syft + grype via Docker Hub (GitHub release CDN flaps 504s; Docker Hub is separate).
          mkdir -p "$HOME/.local/bin"
          bash scripts/install-tool-from-docker.sh anchore/syft:latest  /syft  "$HOME/.local/bin/syft"
          bash scripts/install-tool-from-docker.sh anchore/grype:latest /grype "$HOME/.local/bin/grype"
          # cosign from the Sigstore project's gcr.io image (v2.6.5 pinned).
          bash scripts/install-tool-from-docker.sh gcr.io/projectsigstore/cosign:v2.6.5 /ko-app/cosign "$HOME/.local/bin/cosign"
          chmod +x "$HOME/.local/bin/cosign"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (depends_on chain in scripts/build-image.sh pulls the baseline)
        env:
          IMAGE_DIR: ${{ matrix.image_dir }}
          FORGE_CACHE_FROM_PREFIX: ghcr.io/bboortz
          FORGE_CACHE_PUSH: '1'
          # FG-048 follow-up: authenticated GitHub API for build.ref-latest-
          # release curl calls. Shared GHA runner IPs exhaust the 60/hr
          # unauthenticated cap during parallel matrix publish; the authed
          # cap is 5000/hr. Fixes 2026-11-14 run 43613702946 flake.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: REGISTRY="$REGISTRY" bash scripts/build-image.sh "$IMAGE_DIR"
      - name: Scan + SBOM
        env:
          IMAGE_DIR: ${{ matrix.image_dir }}
        run: make scan IMAGE_DIR="$IMAGE_DIR" REGISTRY="$REGISTRY"
      - name: Push image (4 tags per variant — FG-004)
        id: push
        env:
          REPO: ${{ matrix.repo }}
          TAG: ${{ matrix.tag }}
          ARCH: amd64
        run: |
          IMAGE_REF="${REGISTRY}/${REPO}:${TAG}"
          docker push "${IMAGE_REF}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_REF}" | sed 's/.*@//')
          for extra in "${TAG}-${ARCH}" "latest" "latest-${ARCH}"; do
            docker tag  "${IMAGE_REF}" "${REGISTRY}/${REPO}:${extra}"
            docker push "${REGISTRY}/${REPO}:${extra}"
          done
          echo "image_digest=${REGISTRY}/${REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: cosign sign (keyless)
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
        run: cosign sign --yes "$IMAGE_DIGEST"
      - name: cosign attest — CycloneDX SBOM
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
          SBOM: build/${{ matrix.safe_name }}-${{ matrix.tag }}.sbom.json
        run: cosign attest --yes --predicate "$SBOM" --type cyclonedx "$IMAGE_DIGEST"
      - name: cosign attest — grype vuln scan
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
          GRYPE: build/${{ matrix.safe_name }}-${{ matrix.tag }}.grype.json
        run: cosign attest --yes --predicate "$GRYPE" --type vuln "$IMAGE_DIGEST"
      - name: Publish-time verify
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/bboortz/forge/.github/workflows/build.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_DIGEST"
      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.safe_name }}-${{ matrix.tag }}
          path: build/
          retention-days: 30
