name: Build — daily publish (cron + manual)

on:
  schedule:
    - cron: "0 3 * * *"      # 03:00 UTC — see memory/design-decisions.md
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write            # push to ghcr.io
  id-token: write            # OIDC token for keyless cosign signing

jobs:

  # Discovery job: emit a JSON matrix listing every images/<dir>/image.yaml
  # so adding a new image dir auto-enrolls in the publish pipeline with no
  # workflow edit. Delegates to scripts/discover-images.sh.
  discover:
    name: Discover image dirs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.disc.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: disc
        run: |
          echo "matrix=$(bash scripts/discover-images.sh | jq -c .)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.image_dir }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      REGISTRY: ghcr.io/bboortz

    steps:
      - uses: actions/checkout@v4

      - name: Install syft + grype + cosign (v2.4.3 pinned — review by 2026-11-17)
        # cosign is pinned to v2.4.3 because v3.x stores signatures as OCI 1.1
        # referrers (sha256-<digest> with no .sig tag), which legacy v2 verifiers
        # cannot find. Local `make sign-local` also uses v2 (--tlog-upload=false
        # dropped in v3). Review the migration path by 2026-11-17: either upgrade
        # everything to v3 + rewrite sign-local around a tlog-less signing-config,
        # or renew the v2 pin.
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh  | sh -s -- -b "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/cosign" https://github.com/sigstore/cosign/releases/download/v2.4.3/cosign-linux-amd64
          chmod +x "$HOME/.local/bin/cosign"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build via scripts/build-image.sh (reads image.yaml)
        env:
          IMAGE_DIR: ${{ matrix.image_dir }}
        run: REGISTRY="$REGISTRY" bash scripts/build-image.sh "$IMAGE_DIR"

      - name: Scan + SBOM
        env:
          IMAGE_DIR: ${{ matrix.image_dir }}
        run: make scan IMAGE_DIR="$IMAGE_DIR" REGISTRY="$REGISTRY"

      - name: Push image (4 tags per variant per run — see FG-004)
        id: push
        env:
          REPO: ${{ matrix.repo }}
          TAG: ${{ matrix.tag }}
          ARCH: amd64            # TODO(FG-005): expand when arm64 lands
        run: |
          IMAGE_REF="${REGISTRY}/${REPO}:${TAG}"
          docker push "${IMAGE_REF}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_REF}" | sed 's/.*@//')
          # Tag + push three siblings pointing at the same digest:
          #   :<tag>-<arch>, :latest, :latest-<arch>
          # Cosign signs the digest (shared), so each tag inherits the signature.
          for extra in "${TAG}-${ARCH}" "latest" "latest-${ARCH}"; do
            docker tag  "${IMAGE_REF}" "${REGISTRY}/${REPO}:${extra}"
            docker push "${REGISTRY}/${REPO}:${extra}"
          done
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "image_digest=${REGISTRY}/${REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: cosign sign (keyless)
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
        run: cosign sign --yes "$IMAGE_DIGEST"

      - name: cosign attest — CycloneDX SBOM
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
          SBOM: build/${{ matrix.repo }}-${{ matrix.tag }}.sbom.json
        run: cosign attest --yes --predicate "$SBOM" --type cyclonedx "$IMAGE_DIGEST"

      - name: cosign attest — grype vuln scan
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
          GRYPE: build/${{ matrix.repo }}-${{ matrix.tag }}.grype.json
        run: cosign attest --yes --predicate "$GRYPE" --type vuln "$IMAGE_DIGEST"

      - name: Publish-time verify (sanity check from the runner)
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/bboortz/forge/.github/workflows/build.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_DIGEST"

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.repo }}-${{ matrix.tag }}
          path: build/
          retention-days: 30
