name: PR — build + scan (no publish)

on:
  pull_request:
    paths:
      - "images/**"
      - "Makefile"
      - "scripts/**"
      - "tests/acceptance/**"
      - ".github/workflows/pr.yml"

permissions:
  contents: read
  # Keyless signing is a build.yml-only capability (OIDC permission intentionally omitted).

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: python
      IMAGE_TAG: 3.13-slim-trixie

    steps:
      - uses: actions/checkout@v4

      - name: Install syft + grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh  | sh -s -- -b "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck yamllint
          curl -sSfL -o /tmp/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /tmp/hadolint && sudo mv /tmp/hadolint /usr/local/bin/hadolint
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Fast gates
        run: make test-fast

      - name: Build
        run: make build IMAGE_NAME=$IMAGE_NAME IMAGE_TAG=$IMAGE_TAG

      - name: Scan
        run: make scan IMAGE_NAME=$IMAGE_NAME IMAGE_TAG=$IMAGE_TAG

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}
          path: build/
          retention-days: 14
