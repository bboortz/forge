---
# FG-087: dev → main promotion via auto-merge PR.
#
# Historical (pre-FG-087): release.yml pushed directly to the main ref after
# a fast-forward merge. That broke the moment main was protected with a required
# status check that only attaches to PRs (`resolve-pr`, app 15368). FG-086's
# promotion required a manual loosen-push-restore cycle on branch protection.
#
# New flow: open (or reuse) a short-lived PR from dev → main, enable
# auto-merge, and let GitHub handle the merge once required checks pass.
# Branch protection on main stays untouched.
#
# Trigger: workflow_dispatch (manual button).
# No VERSION/tag/CHANGELOG gates in V1 — those arrive with a future story.

name: Release

"on":
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to promote (default: dev)"
        default: "dev"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    name: Promote → main
    runs-on: ubuntu-latest
    # Typical ~2 min (pre-flight check + PR create + enable auto-merge).
    # Headroom for `resolve-pr` + any other checks to land on the new PR
    # once GitHub schedules them; the final wait-for-merge step polls with
    # its own cap below.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch source branch
        run: |
          git fetch origin "${{ inputs.ref }}:promote-src" --force
          echo "SRC_SHA=$(git rev-parse promote-src)" >> "$GITHUB_ENV"
          echo "SRC_REF=${{ inputs.ref }}" >> "$GITHUB_ENV"

      - name: Assert CI green on source HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # FG-024: the source-of-truth check-run name is now
          # "Acceptance aggregate (all green)" (the matrix gate) +
          # "Lint & verify (PR + push-to-dev)" (the lint gate). Both must
          # be green. If CI hasn't finished yet, there's no success record
          # and we abort — operator should wait for the badges to turn
          # green then re-run.
          for check in "Acceptance aggregate (all green)" "Lint & verify (PR + push-to-dev)"; do
            STATUS=$(gh api --paginate "repos/${{ github.repository }}/commits/${SRC_SHA}/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name == \"${check}\")] | sort_by(.started_at) | .[-1].conclusion" \
              2>/dev/null || echo "")
            if [[ "$STATUS" != "success" ]]; then
              echo "::error::'${check}' on ${SRC_SHA:0:8} not green (status=${STATUS:-not-yet-run}). Wait for CI to pass before promoting."
              exit 1
            fi
            echo "✓ ${check} green on ${SRC_SHA:0:8}"
          done

      - name: Find or create dev→main PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: if a previous release run left an open PR, reuse it
          # (just update its body with the current SHA); else open a new one.
          EXISTING=$(gh pr list --base main --head "${SRC_REF}" --state open --json number --jq '.[0].number // empty')
          if [[ -n "${EXISTING}" ]]; then
            echo "✓ Reusing existing release PR #${EXISTING}"
            echo "PR_NUMBER=${EXISTING}" >> "$GITHUB_ENV"
            gh pr edit "${EXISTING}" --body "Promote ${SRC_REF} @ \`${SRC_SHA:0:8}\` → main. Triggered by release.yml run ${{ github.run_id }}."
          else
            PR_URL=$(gh pr create \
              --base main \
              --head "${SRC_REF}" \
              --title "release: promote ${SRC_REF} → main" \
              --body "Promote ${SRC_REF} @ \`${SRC_SHA:0:8}\` → main. Opened by release.yml run ${{ github.run_id }}. Auto-merges when required checks pass.")
            PR_NUMBER=$(basename "${PR_URL}")
            echo "✓ Opened release PR #${PR_NUMBER}: ${PR_URL}"
            echo "PR_NUMBER=${PR_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Enable auto-merge on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --merge: keep the merge-commit (preserves dev's full history on main).
          # --auto: GitHub merges once all required status checks + review
          # requirements are satisfied. If no checks are required, merges
          # immediately.
          gh pr merge "${PR_NUMBER}" --merge --auto
          echo "✓ Auto-merge enabled on PR #${PR_NUMBER}"

      - name: Wait for PR merge
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 10
        run: |
          # Poll the PR until it's merged (or this step times out). This gives
          # observers a single workflow status to watch instead of leaving the
          # merge pending silently in the background.
          until state=$(gh pr view "${PR_NUMBER}" --json state,mergedAt --jq '"\(.state):\(.mergedAt // "null")"') \
                && [[ "${state%%:*}" == "MERGED" ]]; do
            echo "  pr #${PR_NUMBER} state=${state} — waiting…"
            sleep 15
          done
          MERGE_SHA=$(gh pr view "${PR_NUMBER}" --json mergeCommit --jq '.mergeCommit.oid // empty')
          echo "MERGE_SHA=${MERGE_SHA}" >> "$GITHUB_ENV"
          echo "✓ PR #${PR_NUMBER} merged: main now at ${MERGE_SHA:0:8}"

      - name: Summary
        run: |
          {
            echo "## Promoted → main"
            echo "- Source: \`${SRC_REF}\` @ \`${SRC_SHA:0:8}\`"
            echo "- Release PR: #${PR_NUMBER}"
            echo "- Main now at: \`${MERGE_SHA:0:8}\`"
            echo ""
            echo "Next daily cron will publish from the new main HEAD."
          } >> "$GITHUB_STEP_SUMMARY"
