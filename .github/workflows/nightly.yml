---
# FG-017: nightly safety-net gate. Runs the full `make check-strict` (clean
# cache, every image rebuilt cold, every acceptance test, every smoke) on
# `dev` HEAD. Catches "smart pre-push was wrong about the affected set" —
# the safety net that makes scope-based pre-push acceptable.
name: Nightly check-strict

on:
  schedule:
    # 02:30 UTC — well before the 03:00 UTC build.yml cron so a failure
    # here can block the daily publish via a slack/email signal.
    - cron: '30 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      # FG-022: cache grype CVE DB (daily rotation).
      - name: Current UTC day
        id: dt
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache grype DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/grype
          key: grype-db-${{ runner.os }}-${{ steps.dt.outputs.day }}
          restore-keys: |
            grype-db-${{ runner.os }}-

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq shellcheck yamllint jq python3-yaml
          # hadolint is NOT in Ubuntu apt (the 2026-11-09 nightly failure root
          # cause — ubuntu-latest runner drops the package). Use the same
          # Docker Hub extract path ci.yml adopted on 2026-11-08 after the
          # GitHub-releases CDN flapped 504s.
          sudo bash scripts/install-tool-from-docker.sh hadolint/hadolint:latest-debian /bin/hadolint /usr/local/bin/hadolint
          command -v grype >/dev/null || sudo bash scripts/install-tool-from-docker.sh anchore/grype:latest /grype /usr/local/bin/grype
          command -v syft  >/dev/null || sudo bash scripts/install-tool-from-docker.sh anchore/syft:latest  /syft  /usr/local/bin/syft
          # cosign (needed by check-strict's sign-local / verify targets).
          # Pinned to v2.4.3 as in ci.yml's acceptance-matrix job.
          sudo bash scripts/install-tool-from-docker.sh gcr.io/projectsigstore/cosign:v2.4.3 /ko-app/cosign /usr/local/bin/cosign
          sudo chmod +x /usr/local/bin/cosign
          # actionlint via `go install` (ci.yml pattern).
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # FG-021: nightly runs check-strict (clean-cache rebuild). Buildx cache
      # is still useful here for the FROM-base-image layer (saves the python-
      # slim-trixie pull per image). Don't push cache from nightly — it
      # intentionally rebuilds everything cold.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: make check-strict
        env:
          FORGE_CACHE_FROM_PREFIX: ghcr.io/bboortz
          FORGE_CACHE_PUSH: '0'
        run: make check-strict
