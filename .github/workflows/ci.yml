---
# Stratified CI, inherited from beaconry's ci.yml shape:
#   feat/fix/docs/chore/refactor push → fast tier    (lint + verify-* only)
#   dev push + PRs to dev             → full tier    (make check: fast + acceptance)
#   main push                         → release-check (minimal in V1)

name: CI

"on":
  push:
    branches:
      - main
      - dev
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"
      - "refactor/**"
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  fast-check:
    name: Fast check (lint + verify-*)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      !contains(fromJSON('["refs/heads/dev", "refs/heads/main"]'), github.ref)
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck yamllint jq
          curl -sSfL -o /tmp/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /tmp/hadolint && sudo mv /tmp/hadolint /usr/local/bin/hadolint
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: make test-fast
        run: make test-fast

  full-check:
    name: Full check (make check)
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request' && github.base_ref == 'dev')
    steps:
      - uses: actions/checkout@v4

      - name: Install lint + supply-chain tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck yamllint jq
          curl -sSfL -o /tmp/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /tmp/hadolint && sudo mv /tmp/hadolint /usr/local/bin/hadolint
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh  | sh -s -- -b "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/cosign" https://github.com/sigstore/cosign/releases/download/v2.4.3/cosign-linux-amd64
          chmod +x "$HOME/.local/bin/cosign"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: make check (fast + acceptance)
        run: make check

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-artifacts
          path: build/
          retention-days: 14

  release-check:
    name: Release check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Note
        run: echo "Release-check tier is intentionally minimal in V1. Grows as we add CHANGELOG/VERSION gates."
