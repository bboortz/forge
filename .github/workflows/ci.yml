---
# Stratified CI, inherited from beaconry's ci.yml shape:
#   feat/fix/docs/chore/refactor push → fast tier    (lint + verify-* only)
#   dev push + PRs to dev             → full tier    (make check: fast + acceptance)
#   main push                         → release-check (minimal in V1)

name: CI

"on":
  push:
    branches:
      - main
      - dev
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"
      - "refactor/**"
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  fast-check:
    name: Fast check (lint + verify-*)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      !contains(fromJSON('["refs/heads/dev", "refs/heads/main"]'), github.ref)
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck yamllint jq
          curl -sSfL -o /tmp/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /tmp/hadolint && sudo mv /tmp/hadolint /usr/local/bin/hadolint
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: make test-fast
        run: make test-fast

  full-check:
    name: Full check (make check)
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request' && github.base_ref == 'dev')
    steps:
      - uses: actions/checkout@v4
        with:
          # FG-018: smart-check needs full history to resolve `git diff origin/dev..HEAD`.
          fetch-depth: 0

      # FG-021: enable buildx + GHCR auth for registry-backed layer cache.
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR for cache pull/push
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true   # fork PRs can't auth; fall back to cold build

      - name: Current UTC day (for grype DB cache key)
        id: dt
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # FG-022: cache grype's CVE DB across CI runs. ~20 MB; daily rotation.
      - name: Cache grype DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/grype
          key: grype-db-${{ runner.os }}-${{ steps.dt.outputs.day }}
          restore-keys: |
            grype-db-${{ runner.os }}-

      - name: Install lint + supply-chain tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck yamllint jq python3-yaml
          curl -sSfL -o /tmp/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /tmp/hadolint && sudo mv /tmp/hadolint /usr/local/bin/hadolint
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh  | sh -s -- -b "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/cosign" https://github.com/sigstore/cosign/releases/download/v2.4.3/cosign-linux-amd64
          chmod +x "$HOME/.local/bin/cosign"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # FG-018: on PR we scope via smart-check (fast); on push-to-dev we still
      # run the full `make check` (dev is the stable baseline). A `full-check`
      # PR label forces check-strict for cross-cutting PRs that want extra
      # confidence beyond smart-check's dispatch.
      - name: Determine gate target
        id: gate
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            labels='${{ toJSON(github.event.pull_request.labels.*.name) }}'
            if echo "$labels" | grep -q '"full-check"'; then
              echo "target=check-strict" >> "$GITHUB_OUTPUT"
              echo "→ PR has 'full-check' label — using check-strict"
            else
              echo "target=check-smart" >> "$GITHUB_OUTPUT"
              echo "→ PR CI — using check-smart (FG-018)"
            fi
          else
            echo "target=check" >> "$GITHUB_OUTPUT"
            echo "→ push-to-dev — using full check"
          fi

      - name: make ${{ steps.gate.outputs.target }}
        env:
          # FG-021: per-image buildx cache resolution happens in build-image.sh
          # from this prefix. PR events: pull cache only (no write perm on forks).
          FORGE_CACHE_FROM_PREFIX: ghcr.io/bboortz
          FORGE_CACHE_PUSH: ${{ github.event_name == 'push' && '1' || '0' }}
        run: make ${{ steps.gate.outputs.target }}

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-artifacts
          path: build/
          retention-days: 14

  release-check:
    name: Release check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Note
        run: echo "Release-check tier is intentionally minimal in V1. Grows as we add CHANGELOG/VERSION gates."
