---
# Stratified CI:
#   feat/fix/docs/chore/refactor push → fast-check   (lint only)
#   dev push + PRs to dev             → lint-verify + acceptance-matrix + acceptance-aggregate
#   main push                         → release-check (minimal in V1)
#
# FG-024: acceptance tests fan out as a GHA matrix (one job per test file).
# Wall-clock bound = slowest single test. Local `make check` is unchanged.

name: CI

"on":
  push:
    branches:
      - main
      - dev
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"
      - "refactor/**"
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  fast-check:
    name: Fast check (lint + verify-*)
    runs-on: ubuntu-latest
    # FG-038: 5-min cap. Typical 30s lint pass. 10× headroom protects
    # against GHA runner slow-starts without masking genuine hangs.
    timeout-minutes: 5
    if: >
      github.event_name == 'push' &&
      !contains(fromJSON('["refs/heads/dev", "refs/heads/main"]'), github.ref)
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck yamllint jq
          # hadolint via Docker Hub (different CDN than GitHub releases; GH flapped 504s on 2026-11-08).
          sudo bash scripts/install-tool-from-docker.sh hadolint/hadolint:latest-debian /bin/hadolint /usr/local/bin/hadolint
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: make test-fast
        run: make test-fast

  # FG-024: lint + verify-* on PR/dev (no acceptance here — that's the matrix).
  lint-verify:
    name: Lint & verify (PR + push-to-dev)
    runs-on: ubuntu-latest
    # FG-038: 5-min cap. Typical 45s lint + traceability + verify-contracts.
    timeout-minutes: 5
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request' && github.base_ref == 'dev')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck yamllint jq python3-yaml
          # hadolint via Docker Hub (different CDN than GitHub releases; GH flapped 504s on 2026-11-08).
          sudo bash scripts/install-tool-from-docker.sh hadolint/hadolint:latest-debian /bin/hadolint /usr/local/bin/hadolint
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: make test-fast
        run: make test-fast

  # FG-024: emit the acceptance-test matrix. One include entry per test_FG_*.sh.
  discover:
    name: Discover acceptance tests
    runs-on: ubuntu-latest
    # FG-038: 5-min cap. Typical 10s (jq over tests/acceptance glob).
    timeout-minutes: 5
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request' && github.base_ref == 'dev')
    outputs:
      matrix: ${{ steps.disc.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: disc
        run: |
          echo "matrix=$(bash scripts/discover-tests.sh)" >> "$GITHUB_OUTPUT"

  # FG-024: run EACH acceptance test in its own GHA job.
  acceptance-matrix:
    name: ${{ matrix.fg_id }}
    runs-on: ubuntu-latest
    needs: discover
    # FG-038: 6-min cap per matrix cell. Typical 1-3 min; cap at ~2×
    # worst-case typical. The hang observed on run 42602539732 job
    # 129110343041 (FG-011 stuck on Cache grype DB for 20+ min) is now
    # bounded — if a cell hangs it dies at 6 min, acceptance-aggregate
    # fails fast, operator retries the single cell via GHA re-run UI.
    timeout-minutes: 6
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request' && github.base_ref == 'dev')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR for cache pull/push
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Current UTC day (for grype DB cache key)
        id: dt
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache grype DB
        uses: actions/cache@v4
        # FG-038: cache action can hang on GHA service slowness (observed
        # on run 42602539732). 3-min cap + continue-on-error: a stuck
        # fetch fails fast, grype falls back to fresh DB download
        # (~30s). Pipeline never blocks on cache infra.
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: ~/.cache/grype
          key: grype-db-${{ runner.os }}-${{ steps.dt.outputs.day }}
          restore-keys: |
            grype-db-${{ runner.os }}-

      - name: Install supply-chain tools
        # FG-038: 5-min cap. Typical 20-40s. Docker Hub rate-limit
        # backoffs can extend; 5 min catches pathological cases.
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck yamllint jq python3-yaml
          # syft + grype via Docker Hub (GitHub release CDN flaps 504s; Docker Hub is separate).
          mkdir -p "$HOME/.local/bin"
          bash scripts/install-tool-from-docker.sh anchore/syft:latest  /syft  "$HOME/.local/bin/syft"
          bash scripts/install-tool-from-docker.sh anchore/grype:latest /grype "$HOME/.local/bin/grype"
          # cosign from the Sigstore project's gcr.io image (v2.4.3 pinned).
          bash scripts/install-tool-from-docker.sh gcr.io/projectsigstore/cosign:v2.4.3 /ko-app/cosign "$HOME/.local/bin/cosign"
          chmod +x "$HOME/.local/bin/cosign"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run ${{ matrix.fg_id }}
        env:
          _FORGE_IN_CHECK: '1'   # dedup sentinel used by tests that call test-images.sh
          FORGE_CACHE_FROM_PREFIX: ghcr.io/bboortz
          FORGE_CACHE_PUSH: ${{ github.event_name == 'push' && '1' || '0' }}
        run: bash "${{ matrix.test }}"

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.fg_id }}
          path: build/
          retention-days: 7
          if-no-files-found: ignore

  # FG-024: single green/red gate that aggregates the matrix for branch protection.
  acceptance-aggregate:
    name: Acceptance aggregate (all green)
    runs-on: ubuntu-latest
    needs: acceptance-matrix
    # FG-038: 2-min cap. Pure branch-protection aggregator — just exits
    # 0/1 based on matrix outcomes.
    timeout-minutes: 2
    if: >
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
       (github.event_name == 'pull_request' && github.base_ref == 'dev'))
    steps:
      - name: Assert every matrix job passed
        run: |
          result="${{ needs.acceptance-matrix.result }}"
          echo "acceptance-matrix result: ${result}"
          if [[ "${result}" != "success" ]]; then
            echo "::error::one or more acceptance tests failed"
            exit 1
          fi

  release-check:
    name: Release check
    runs-on: ubuntu-latest
    # FG-038: 5-min cap. Typical 10s (minimal post-main-move signal).
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Note
        run: echo "Release-check tier is intentionally minimal in V1. Grows as we add CHANGELOG/VERSION gates."
