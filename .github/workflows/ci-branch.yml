---
# Stratified CI:
#   feat/fix/docs/chore/refactor push → fast-check   (lint only)
#   dev push + PRs to dev             → lint-verify + acceptance-matrix + acceptance-aggregate
#   main push                         → release-check (minimal in V1)
#
# FG-024: acceptance tests fan out as a GHA matrix (one job per test file).
# Wall-clock bound = slowest single test. Local `make check` is unchanged.

name: ci-branch

"on":
  push:
    branches:
      - main
      - dev
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"
      - "refactor/**"
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  fast-check:
    name: Fast check (lint + verify-*)
    runs-on: ubuntu-latest
    # FG-038: 5-min cap. Typical 30s lint pass. 10× headroom protects
    # against GHA runner slow-starts without masking genuine hangs.
    timeout-minutes: 5
    if: >
      github.event_name == 'push' &&
      !contains(fromJSON('["refs/heads/dev", "refs/heads/main"]'), github.ref)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck yamllint jq
          # hadolint via Docker Hub (different CDN than GitHub releases; GH flapped 504s on 2026-11-08).
          sudo bash scripts/install-tool-from-docker.sh hadolint/hadolint:latest-debian /bin/hadolint /usr/local/bin/hadolint
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: make test-fast
        run: make test-fast

  # FG-024: lint + verify-* on PR/dev (no acceptance here — that's the matrix).
  lint-verify:
    name: Lint & verify (PR + push-to-dev)
    runs-on: ubuntu-latest
    # FG-038: 5-min cap. Typical 45s lint + traceability + verify-contracts.
    timeout-minutes: 5
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request' && github.base_ref == 'dev')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck yamllint jq python3-yaml
          # hadolint via Docker Hub (different CDN than GitHub releases; GH flapped 504s on 2026-11-08).
          sudo bash scripts/install-tool-from-docker.sh hadolint/hadolint:latest-debian /bin/hadolint /usr/local/bin/hadolint
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: make test-fast
        run: make test-fast

  # FG-024 + FG-090 (SH-022): emit the acceptance-test matrix.
  # On PRs: scoped to tests that cover images affected by the diff
  # (via scripts/smart-check.sh dry-run → scripts/discover-affected-tests.sh).
  # Baseline/tooling touches trigger a full-run bailout (84 cells).
  # Docs-only touches emit an empty matrix (lint-verify still runs).
  # On dev push: always full matrix (safety net — covers merge races).
  discover:
    name: Discover acceptance tests
    runs-on: ubuntu-latest
    # FG-038: 5-min cap. Typical 15s: smart-check dry-run + jq + grep over tests.
    timeout-minutes: 5
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request' && github.base_ref == 'dev')
    outputs:
      matrix: ${{ steps.disc.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full fetch so smart-check.sh can `git diff origin/dev...HEAD`.
          fetch-depth: 0

      - name: Install python3-yaml (smart-check dep)
        run: sudo apt-get update -qq && sudo apt-get install -y python3-yaml jq

      - id: disc
        run: |
          # FG-090: PR → scoped matrix via smart-check; push-to-dev → full matrix.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            matrix=$(bash scripts/discover-affected-tests.sh)
          else
            matrix=$(bash scripts/discover-tests.sh)
          fi
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "::notice::acceptance matrix: $(echo "${matrix}" | jq '.include | length') cells"

  # FG-024: run EACH acceptance test in its own GHA job.
  acceptance-matrix:
    name: ${{ matrix.fg_id }}
    runs-on: ubuntu-latest
    needs: discover
    # FG-038: 15-min cap per matrix cell (bumped from 10 — see below).
    # Typical 1-3 min; cap was 6 pre-FG-048 but the from-source dual-
    # builder tests legitimately push 5-7 min cold, and the heaviest
    # ones (FG-040 prometheus-classic-ui-assets: React UI compile + Go
    # `-tags builtinassets` build + scan + verify; FG-048b analog) have
    # been hitting the 10-min wall on busy GHA runners — 3× consecutive
    # cancellations observed on dev CI post-FG-072 merge (run
    # 44617780961). 15-min cap still catches the original class of
    # hang (FG-011 run 42602539732 was 20+ min). If a cell hangs it
    # dies at 15 min, acceptance-aggregate fails fast, operator
    # retries the single cell via GHA re-run UI.
    timeout-minutes: 15
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request' && github.base_ref == 'dev')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Login to GHCR for cache pull/push
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Current UTC day (for grype DB cache key)
        id: dt
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache grype DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        # FG-038: cache action can hang on GHA service slowness (observed
        # on run 42602539732). 3-min cap + continue-on-error: a stuck
        # fetch fails fast, grype falls back to fresh DB download
        # (~30s). Pipeline never blocks on cache infra.
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: ~/.cache/grype
          key: grype-db-${{ runner.os }}-${{ steps.dt.outputs.day }}
          restore-keys: |
            grype-db-${{ runner.os }}-

      - name: Install supply-chain tools
        # FG-038: 5-min cap. Typical 20-40s. Docker Hub rate-limit
        # backoffs can extend; 5 min catches pathological cases.
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck yamllint jq python3-yaml
          # syft + grype via Docker Hub (GitHub release CDN flaps 504s; Docker Hub is separate).
          mkdir -p "$HOME/.local/bin"
          bash scripts/install-tool-from-docker.sh anchore/syft:latest  /syft  "$HOME/.local/bin/syft"
          bash scripts/install-tool-from-docker.sh anchore/grype:latest /grype "$HOME/.local/bin/grype"
          # cosign from the Sigstore project's gcr.io image (v2.6.5 pinned).
          bash scripts/install-tool-from-docker.sh gcr.io/projectsigstore/cosign:v2.6.5 /ko-app/cosign "$HOME/.local/bin/cosign"
          chmod +x "$HOME/.local/bin/cosign"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run ${{ matrix.fg_id }}
        env:
          _FORGE_IN_CHECK: '1'   # dedup sentinel used by tests that call test-images.sh
          FORGE_CACHE_FROM_PREFIX: ghcr.io/bboortz
          FORGE_CACHE_PUSH: ${{ github.event_name == 'push' && '1' || '0' }}
          # FG-048 follow-up: authenticated GitHub API for build.ref-latest-
          # release curl calls (prevents the 60/hr unauthenticated cap from
          # biting PR CI on shared GHA runner IPs). See build.yml for same
          # treatment on the publish pipeline.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "${{ matrix.test }}"

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scan-${{ matrix.fg_id }}
          path: build/
          retention-days: 7
          if-no-files-found: ignore

  # FG-024: single green/red gate that aggregates the matrix for branch protection.
  acceptance-aggregate:
    name: Acceptance aggregate (all green)
    runs-on: ubuntu-latest
    needs: acceptance-matrix
    # FG-038: 2-min cap. Pure branch-protection aggregator — just exits
    # 0/1 based on matrix outcomes.
    timeout-minutes: 2
    if: >
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
       (github.event_name == 'pull_request' && github.base_ref == 'dev'))
    steps:
      - name: Assert every matrix job passed
        run: |
          result="${{ needs.acceptance-matrix.result }}"
          echo "acceptance-matrix result: ${result}"
          # FG-090 (SH-022): docs-only diffs emit an empty matrix → acceptance-
          # matrix is `skipped`. Treat as success — lint-verify covered it.
          if [[ "${result}" == "success" || "${result}" == "skipped" ]]; then
            echo "acceptance aggregate: ok"
            exit 0
          fi
          echo "::error::one or more acceptance tests failed (${result})"
          exit 1

  release-check:
    name: Release check
    runs-on: ubuntu-latest
    # FG-038: 5-min cap. Typical 10s (minimal post-main-move signal).
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Note
        run: echo "Release-check tier is intentionally minimal in V1. Grows as we add CHANGELOG/VERSION gates."
