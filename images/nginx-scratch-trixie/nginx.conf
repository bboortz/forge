# Minimal self-contained nginx config shipped in nginx-scratch-trixie.
# Deliberately NO `include` directives — scratch runtime has no conf.d/,
# sites-enabled/, or modules-enabled/, and consumers who want them can
# mount their own config with `-v $(pwd)/my.conf:/etc/nginx/nginx.conf`.
#
# Logs go to the container's stdout/stderr (standard docker pattern).
# Pid file lives in /tmp (writable; same mount in scratch as elsewhere).
# Single worker; consumers tune this via a custom config.

user www-data www-data;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    server {
        listen 80 default_server;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
