# Authoritative contract for postgres-scratch-trixie.
#
# Scratch runtime: PostgreSQL 18 FROM scratch. postgres uid pinned to 999
# (Docker Hub convention) for data-dir compatibility. Init requires a
# shelled sidecar (initdb uses system() internally) — see FG-007 pattern.

spec_version: 1
image: postgres-scratch-trixie
version: "0.3"

promises:
  - id: runtime.postgres-binary
    description: /usr/lib/postgresql/18/bin/postgres present, executes, `postgres --version` prints a version string.
    caps: [build.two-stage-scratch]
    tests:
      - images/postgres-scratch-trixie/tests/smoke_binary_runs.sh

  - id: runtime.server-accepts-sql
    description: Against a cluster initialized by a shelled sidecar, container accepts SQL connections and answers `SELECT 1`.
    caps: [image.postgres-serves-sql, test.sidecar-init, test.smoke-server-helper]
    tests:
      - images/postgres-scratch-trixie/tests/smoke_server_accepts.sh

  - id: runtime.locale-utf8
    description: "C.UTF-8 + en_US.UTF-8 locales are compiled into /usr/lib/locale/ so glibc's setlocale(LC_ALL, 'C.UTF-8') and setlocale(LC_ALL, 'en_US.UTF-8') succeed at runtime. initdb --locale=<either> produces a cluster where lc_ctype + lc_collate match, UPPER/LOWER respect Latin-1 Supplement, length('€') == 1, and en_US.UTF-8 ORDER BY sorts Unicode-alphabetically rather than byte-wise."
    caps: [image.locale-utf8, image.postgres-serves-sql]
    tests:
      - images/postgres-scratch-trixie/tests/smoke_locale_utf8.sh

  - id: identity.postgres-uid
    description: postgres user at uid 999 / gid 999 (Docker Hub convention). Data dirs initialized by Docker Hub's postgres:18 or Forge postgres-scratch-trixie are mutually readable.
    caps: [image.postgres-serves-sql]
    tests:
      - images/postgres-scratch-trixie/tests/smoke_server_accepts.sh

  - id: absence.shell
    description: No /bin/sh, /bin/bash, or any shell binary. initdb cannot run in-container (uses system() internally); use a shelled sidecar.
    caps: [image.no-shell, test.sidecar-init]
    tests:
      - images/postgres-scratch-trixie/tests/smoke_no_shell.sh
    inverse: true

  - id: absence.os-cves
    description: grype finds zero Debian-source matches (no LLVM JIT, no plperl/plpython).
    caps: [image.zero-os-cves]
    tests:
      - images/postgres-scratch-trixie/tests/smoke_zero_os_cves.sh
    inverse: true

  - id: shape.size-budget
    description: Image size ≤ 120 MB hard ceiling (postgres binary + stdlib + baseline).
    caps: [test.size-budget]
    tests:
      - images/postgres-scratch-trixie/tests/smoke_size.sh
