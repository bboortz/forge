# FG-072: shared Zig builder base. `FROM ghcr.io/bboortz/forge-builder-zig-trixie:0.1`
# in any from-Zig-source image's builder stage. Sibling of FG-025's
# forge-builder-python-trixie / FG-046's forge-builder-go-trixie /
# FG-048's forge-builder-node-trixie.
#
# Dogfoods zig-slim-trixie per FG-065 arch.language-family-image-pair.
#
# Not a runtime image — not published for `docker run` use. Daily cron
# rebuilds zig-slim-trixie first (publish-pre-builders tier), then this
# image (publish-builders tier), so Zig toolchain fixes land within 24h
# of upstream release, propagating to every from-Zig-source derivative.
#
# Zero consumers today. First consumer (hc migration into forge) is a
# separate follow-up FG.
tag: "0.1"
platforms:
  - linux/amd64
depends_on:
  - zig-slim-trixie
  - mirror/syft
