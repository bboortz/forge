# FG-080: nginx-scratch-alpine contract.

spec_version: 1
image: nginx-scratch-alpine
version: "0.1"

promises:
  - id: runtime.serves-http
    description: Container listens on :80 and serves HTTP 200 on GET / (nginx default welcome page).
    caps: [image.nginx-scratch-alpine]
    tests:
      - images/nginx-scratch-alpine/tests/smoke_serves_http.sh

  - id: runtime.user-nonroot
    description: Container runs as uid 65532 (nonroot baseline inherited from base/scratch-alpine-3's /etc/passwd entry).
    caps: [image.nginx-scratch-alpine]
    tests:
      - images/nginx-scratch-alpine/tests/smoke_user_nonroot.sh

  - id: files.hc-embedded
    description: /hc is present + executable; HEALTHCHECK baked in.
    caps: [image.nginx-scratch-alpine]
    tests:
      - images/nginx-scratch-alpine/tests/smoke_hc_embedded.sh

  - id: files.sbom-embedded
    description: /sbom.json is present (CycloneDX).
    caps: [image.nginx-scratch-alpine]
    tests:
      - images/nginx-scratch-alpine/tests/smoke_sbom_embedded.sh

  - id: shape.no-shell
    description: /bin/sh is NOT present — this is a scratch runtime (no busybox, no debug surface). docker exec -it <image> sh will fail.
    caps: [image.nginx-scratch-alpine]
    tests:
      - images/nginx-scratch-alpine/tests/smoke_no_shell.sh
