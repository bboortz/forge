# Authoritative contract for postgres-slim-trixie (FG-026).
#
# Shelled PostgreSQL 18 on Debian trixie. Preserves the upstream
# docker-entrypoint.sh so secrets-from-FILE + /docker-entrypoint-initdb.d/
# SQL + custom config mounts + shell maintenance hooks all work. The
# `-scratch` variant trades these away for a minimal runtime; this one
# is the "my app expects docker-official postgres semantics" variant.

spec_version: 1
image: postgres-slim-trixie
version: "0.2"

promises:
  - id: runtime.postgres-binary
    description: /usr/lib/postgresql/18/bin/postgres present + executable; `postgres --version` prints "postgres (PostgreSQL) 18.x".
    caps: [build.pr-ci, build.daily-publish]
    tests:
      - images/postgres-slim-trixie/tests/smoke_postgres_version.sh

  - id: runtime.docker-entrypoint
    description: /usr/local/bin/docker-entrypoint.sh (shell script from upstream postgres image) is on PATH. Consumers who set POSTGRES_*_FILE env get secrets-from-FILE handling for free.
    caps: [image.postgres-slim-nextcloud-compatible]
    tests:
      - images/postgres-slim-trixie/tests/smoke_entrypoint_shell.sh

  - id: runtime.initdb-support
    description: /docker-entrypoint-initdb.d/ exists; .sql files in that dir are executed on first boot by upstream entrypoint. Enables Nextcloud-style `CREATE EXTENSION pg_stat_statements` bootstraps.
    caps: [image.postgres-slim-nextcloud-compatible]
    tests:
      - images/postgres-slim-trixie/tests/smoke_entrypoint_shell.sh

  - id: runtime.psql-client
    description: /usr/bin/psql present + executable; maintenance scripts can run `psql -U postgres -c "..."` via the container shell.
    caps: [image.postgres-slim-nextcloud-compatible]
    tests:
      - images/postgres-slim-trixie/tests/smoke_psql.sh

  - id: files.ca-certificates
    description: /etc/ssl/certs/ca-certificates.crt present with Debian trust store. TLS clients (replication, outbound connections) work without re-apt-install.
    caps: [build.pr-ci]
    tests:
      - images/postgres-slim-trixie/tests/smoke_ca_bundle.sh

  - id: shape.size-budget
    description: Image size ≤ upstream postgres:18 × 1.1 (10% headroom for apt-upgrade).
    caps: [test.size-budget]
    tests:
      - images/postgres-slim-trixie/tests/smoke_size.sh

  # FG-058: documentation-grade waiver block. The real scan-regression
  # gate runs via scan-baseline.json (which already lists CVE-2026-6653).
  # scripts/scan-regression.py currently reads machine-waivers only from
  # `absence.os-cves` (scratch pattern); slim images go through the
  # baseline. This block gives operator-visible audit text for every
  # baselined CRITICAL an auditor would ask "why is this accepted?".
  - id: scan.nonzero-accepted
    description: |
      scan-baseline.json accepts a nonzero CRITICAL CVE list — slim
      images inherit postgres:18's full Debian dpkg closure. PR scan-
      regression gate (FG-019) fails on NEW CRITICALs beyond baseline.
      Waivers below document each baselined CVE's reachability for
      operator audit.
    caps: [scan.regression-gate]
    tests:
      - images/postgres-slim-trixie/tests/smoke_size.sh
    waivers:
      - cve: CVE-2026-6653
        reason: |
          libxml2 UAF in SAX2 external-subset parsing. Debian trixie
          marks this <no-dsa> (Minor issue; UAF reachable only via
          CVE-2021-3541 backport, upstream fix requires libxml2 2.11.0+).
          Debian deliberately maintains the vulnerable 2.9.14 ABI as
          the `libxml2` binary package (SONAME libxml2.so.2); the fixed
          2.15.4 ships as a separate `libxml2-16` binary package
          (SONAME libxml2.so.16). postgres:18 is dynamically linked to
          libxml2.so.2 — the legacy ABI bucket — regardless of trixie
          vs sid base, so a sid-pin doesn't help. Reachability: UAF
          triggers only when postgres parses attacker-controlled XML
          via the `xml` data type or `xml2` contrib extension. Homelab
          postgres has zero such usage (verified via grep across
          docker/* + ansible/*). Attack surface is empty for the
          current Forge consumer set. Remove this waiver if:
          (a) Debian backports a .so.2 fix (unlikely per <no-dsa>), OR
          (b) a Forge consumer begins parsing untrusted XML — then
              upgrade to a from-source libxml2 rebuild.
        until: "2027-05-15"
