# Authoritative contract for postgres-slim-trixie (FG-026).
#
# Shelled PostgreSQL 18 on Debian trixie. Preserves the upstream
# docker-entrypoint.sh so secrets-from-FILE + /docker-entrypoint-initdb.d/
# SQL + custom config mounts + shell maintenance hooks all work. The
# `-scratch` variant trades these away for a minimal runtime; this one
# is the "my app expects docker-official postgres semantics" variant.

spec_version: 1
image: postgres-slim-trixie
version: "0.1"

promises:
  - id: runtime.postgres-binary
    description: /usr/lib/postgresql/18/bin/postgres present + executable; `postgres --version` prints "postgres (PostgreSQL) 18.x".
    caps: [build.pr-ci, build.daily-publish]
    tests:
      - images/postgres-slim-trixie/tests/smoke_postgres_version.sh

  - id: runtime.docker-entrypoint
    description: /usr/local/bin/docker-entrypoint.sh (shell script from upstream postgres image) is on PATH. Consumers who set POSTGRES_*_FILE env get secrets-from-FILE handling for free.
    caps: [image.postgres-slim-nextcloud-compatible]
    tests:
      - images/postgres-slim-trixie/tests/smoke_entrypoint_shell.sh

  - id: runtime.initdb-support
    description: /docker-entrypoint-initdb.d/ exists; .sql files in that dir are executed on first boot by upstream entrypoint. Enables Nextcloud-style `CREATE EXTENSION pg_stat_statements` bootstraps.
    caps: [image.postgres-slim-nextcloud-compatible]
    tests:
      - images/postgres-slim-trixie/tests/smoke_entrypoint_shell.sh

  - id: runtime.psql-client
    description: /usr/bin/psql present + executable; maintenance scripts can run `psql -U postgres -c "..."` via the container shell.
    caps: [image.postgres-slim-nextcloud-compatible]
    tests:
      - images/postgres-slim-trixie/tests/smoke_psql.sh

  - id: files.ca-certificates
    description: /etc/ssl/certs/ca-certificates.crt present with Debian trust store. TLS clients (replication, outbound connections) work without re-apt-install.
    caps: [build.pr-ci]
    tests:
      - images/postgres-slim-trixie/tests/smoke_ca_bundle.sh

  - id: shape.size-budget
    description: Image size ≤ upstream postgres:18 × 1.1 (10% headroom for apt-upgrade).
    caps: [test.size-budget]
    tests:
      - images/postgres-slim-trixie/tests/smoke_size.sh
