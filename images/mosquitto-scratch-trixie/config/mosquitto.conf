# Default permissive config baked into mosquitto-scratch-trixie.
# Consumers typically mount their own /mosquitto/config/mosquitto.conf
# over this one — see README of the image for examples.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
