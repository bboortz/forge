# Image metadata consumed by scripts/{build,test,discover}-image(s).sh.
# `repo:` is EXPLICIT because the image dir is nested (`images/base/
# python-trixie/` per FG-069) — same pattern as mirror/syft (FG-066).
# Scratch runtime: interpreter + stdlib + libs + CA bundle + zoneinfo + pip.
# No shell, no apt, no dpkg db.
tag: "3.14"
repo: base/python-scratch-trixie
platforms:
  - linux/amd64
# FG-005 + FG-069: this image derives from base/scratch-trixie via COPY --from=.
# scripts/build-image.sh honours depends_on by (re)building each dep first
# so local `make build IMAGE_DIR=base/python-trixie` works from a cold cache.
depends_on:
  - base/scratch-trixie
