# Authoritative contract for base/ubuntu-slim-noble.
#
# FG-077 public-API slim Ubuntu foundation. Shell + apt retained from
# pre-builder/ubuntu-slim-noble; adds /hc + nonroot uid.

spec_version: 1
image: ubuntu-slim-noble
version: "0.1"

promises:
  - id: files.hc-embedded
    description: /hc is present + executable (static Zig healthcheck binary from bboortz/healthy).
    caps: [image.ubuntu-slim-foundation]
    tests:
      - images/base/ubuntu-slim-noble/tests/smoke_hc_embedded.sh

  - id: runtime.user-nonroot
    description: Container runs as uid 65532 by default.
    caps: [image.ubuntu-slim-foundation]
    tests:
      - images/base/ubuntu-slim-noble/tests/smoke_user_nonroot.sh

  - id: files.tls-stack
    description: /etc/ssl/certs/ca-certificates.crt present (inherited from pre-builder/ubuntu-slim-noble).
    caps: [image.ubuntu-slim-foundation]
    tests:
      - images/base/ubuntu-slim-noble/tests/smoke_ca_bundle.sh

  - id: shape.size-budget
    description: Image size ≤ pre-builder/ubuntu-slim-noble × 1.15.
    caps: [image.ubuntu-slim-foundation]
    tests:
      - images/base/ubuntu-slim-noble/tests/smoke_size.sh
