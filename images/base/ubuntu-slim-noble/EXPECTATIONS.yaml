# What base/ubuntu-slim-noble requires from its upstream dep.
spec_version: 1
image: ubuntu-slim-noble

dependencies:
  - image: ubuntu-slim-noble
    version: ">=0.1"
    expectations:
      - promise: files.ca-certificates
        reason: "Consumers building on base/ubuntu-slim-noble expect outbound HTTPS to work."
        preflight:
          - images/base/ubuntu-slim-noble/tests/smoke_ca_bundle.sh
