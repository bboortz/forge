# FG-051: Forge's first Ubuntu-based image. Pre-builder for any image
# needing a library that Ubuntu ships but Debian trixie doesn't (e.g.
# libicu74 for the GHA runner's .NET 6 runtime).
#
# Current consumers (post-FG-051):
#   - github-runner-noble (builder + runtime stages)
#
# Per FG-042 single-upstream-consumer rule: `FROM ubuntu:24.04` must
# appear in exactly 1 Dockerfile (this one). scripts/verify-no-upstream-
# drift.sh enforces this at commit time.
#
# Codename "noble" = Ubuntu 24.04 LTS (until April 2029). Naming follows
# the Debian pattern (`debian-slim-trixie`); future Ubuntu LTS bases
# would be `ubuntu-slim-<codename>` (e.g. ubuntu-slim-questing for 26.04).
#
# Runtime image — shell + apt kept (image.has-shell contract).
tag: "24.04"
platforms:
  - linux/amd64
