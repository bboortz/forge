# Authoritative contract for healthy-scratch-trixie (FG-030, :2).
#
# v2: hc-based. Replaces FG-029's wget-based :1 (24 MB) with hc
# (~400 KB static Zig binary from ghcr.io/bboortz/hc) + sleep from
# coreutils. Raw FROM scratch (no scratch-base-trixie) — hc is static,
# only sleep needs libc.

spec_version: 1
image: healthy-scratch-trixie
version: "0.2"

promises:
  - id: runtime.hc-binary
    description: "/hc present + runnable (hc 0.1+ from bboortz/healthy — static Zig binary with no libc / heap). Supports tcp://, tls://, http://, https:// probe modes. Exits 0 healthy / 1 unhealthy / 2 usage error."
    caps: [image.healthy-sidecar]
    tests:
      - images/healthy-scratch-trixie/tests/smoke_binary_runs.sh
      - images/healthy-scratch-trixie/tests/smoke_sidecar_healthcheck.sh

  - id: runtime.sleep-binary
    description: "/usr/bin/sleep present + runnable (GNU coreutils). Default CMD = ['/usr/bin/sleep', 'infinity'] so the sidecar container stays alive between healthchecks."
    caps: [image.healthy-sidecar]
    tests:
      - images/healthy-scratch-trixie/tests/smoke_binary_runs.sh
      - images/healthy-scratch-trixie/tests/smoke_cmd_sleeps.sh

  - id: runtime.sidecar-netns-compatible
    description: "With `network_mode: service:<name>` or `--network=container:<name>`, hc reaches the target service via the shared loopback. End-to-end validated against redis-scratch-trixie :6379 (hc exits 0 for live port, 1 for closed port)."
    caps: [image.healthy-sidecar]
    tests:
      - images/healthy-scratch-trixie/tests/smoke_sidecar_healthcheck.sh

  - id: runtime.user-nonroot
    description: "Container runs as uid 65532 (distroless nonroot convention). hc + sleep both work as non-root; no privileged capabilities needed."
    caps: [image.healthy-sidecar]
    tests:
      - images/healthy-scratch-trixie/tests/smoke_cmd_sleeps.sh

  - id: image.no-shell
    description: "No /bin/sh, /bin/bash, /bin/busybox, /usr/bin/sh. Docker healthchecks use exec form [CMD, /hc, ...] which doesn't need a shell."
    caps: [image.no-shell]
    tests:
      - images/healthy-scratch-trixie/tests/smoke_no_shell.sh

  - id: absence.wget
    description: "/usr/bin/wget is deliberately absent — dropped in v2 along with the entire GnuTLS stack (libgnutls, libnettle, libtasn1, libhogweed, libgmp, libffi, libidn2, libp11-kit, libunistring, libpsl, libpcre2-8, libuuid). Image shrank from 24 MB to ~3.5 MB."
    caps: [image.no-shell]
    tests:
      - images/healthy-scratch-trixie/tests/smoke_binary_runs.sh
      - images/healthy-scratch-trixie/tests/smoke_contents.sh

  - id: files.sbom-embed
    description: "/sbom.json present (FG-020). SBOM covers only Debian packages (coreutils, libc6); hc has no OS-package footprint (external binary, SBOM-indexed via the healthy repo)."
    caps: [scan.sbom-embed]
    tests:
      - images/healthy-scratch-trixie/tests/smoke_contents.sh

  - id: shape.size-budget
    description: "Image size ≤ 5 MB absolute ceiling. Actual: ~3.5 MB (hc 400 KB + sleep 40 KB + libc.so.6 2 MB + ld-linux 200 KB + /etc overhead). Smaller than busybox:latest (~4.2 MB) — meets the stated moral target."
    caps: [test.size-budget]
    tests:
      - images/healthy-scratch-trixie/tests/smoke_size.sh
