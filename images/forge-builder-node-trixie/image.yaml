# FG-048: shared Node builder-base. Sibling of forge-builder-go-trixie
# (FG-046) + forge-builder-python-trixie (FG-025).
#
# FG-065: dogfoods node-slim-trixie (FG-061 pre-builder) instead of
# FROMing node:24-trixie-slim upstream directly. Satisfies the
# `arch.language-family-image-pair` invariant.
#
# Not a runtime image — this is a builder-stage base. Consumers:
#   - prometheus-scratch-trixie (dual-builder: Node UI + Go binary)
#   - alertmanager-scratch-trixie (dual-builder: Node UI + Go binary)
#   - uptime-kuma-slim-trixie (Node builder stage)
#
# Published in the `publish-builders` CI tier (needs publish-pre-builders
# to land node-slim-trixie first). Daily cron rebuilds pre-builders →
# this image → every Node-source derivative within 24h.
tag: "0.1"
platforms:
  - linux/amd64
depends_on:
  - pre-builder/node-slim-trixie
  - mirror/syft
