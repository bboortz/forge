# What forge-builder-node-trixie requires from its dependencies.
# FG-065: dogfoods node-slim-trixie (previously FROM node:24-trixie-slim
# upstream directly — "dedicated-toolchain exemption" retired).

spec_version: 1
image: forge-builder-node-trixie

dependencies:
  - image: pre-builder/node-slim-trixie
    version: ">=0.1"
    expectations:
      - promise: runtime.node-binary
        reason: Builder inherits the Node.js runtime from the pre-builder — adding its own tools on top (git, curl, jq, make, g++, python3, syft, corepack enable) via apt-install.
        preflight:
          - images/forge-builder-node-trixie/tests/smoke_node_version.sh

      - promise: files.ca-certificates
        reason: curl + git + npm registry + syft all need the CA trust store for outbound HTTPS. Pre-builder pre-installs ca-certificates so the builder doesn't need to re-apt-install.
        preflight:
          - images/forge-builder-node-trixie/tests/smoke_node_version.sh

      - promise: files.dumb-init
        reason: Builder re-exposes /usr/bin/dumb-init so downstream consumers (uptime-kuma, prometheus-scratch's Node UI builder) can COPY --from=builder /usr/bin/dumb-init into their runtime stage.
        preflight:
          - images/forge-builder-node-trixie/tests/smoke_node_version.sh

      - promise: apt.freshly-upgraded
        reason: Builder runs its own `apt-get upgrade` on top; starting from an already-fresh pre-builder means less churn + faster builds on cold cache.
        preflight:
          - images/forge-builder-node-trixie/tests/smoke_node_version.sh

  - image: syft
    version: ">=0.1"
    expectations:
      - promise: files.syft-binary
        reason: The /syft binary is COPYed from this mirror stage into /usr/local/bin/syft of the builder runtime.
        preflight:
          - images/forge-builder-node-trixie/tests/smoke_syft_available.sh

      - promise: shape.zero-mod
        reason: mirror/syft must be a zero-mod passthrough — any downstream builder expects the exact upstream syft behavior, not a modified derivative.
        preflight:
          - images/forge-builder-node-trixie/tests/smoke_syft_available.sh
