# What forge-builder-go-trixie requires from its dependencies.
# FG-065: dogfoods go-slim-trixie (previously FROM golang:1.27-trixie
# upstream directly — "dedicated-toolchain exemption" retired).

spec_version: 1
image: forge-builder-go-trixie

dependencies:
  - image: pre-builder/go-slim-trixie
    version: ">=0.1"
    expectations:
      - promise: runtime.go-toolchain
        reason: Builder inherits the Go toolchain from the pre-builder — adding its own tools on top (git, curl, jq, syft) via apt-install.
        preflight:
          - images/forge-builder-go-trixie/tests/smoke_has_go.sh

      - promise: files.ca-certificates
        reason: curl + git + go mod download + syft all need the CA trust store for outbound HTTPS (module proxy, GitHub, etc.). Pre-builder pre-installs ca-certificates so the builder doesn't need to re-apt-install.
        preflight:
          - images/forge-builder-go-trixie/tests/smoke_ca_bundle.sh

      - promise: apt.freshly-upgraded
        reason: Builder runs its own `apt-get upgrade` on top; starting from an already-fresh pre-builder means less churn + faster builds on cold cache.
        preflight:
          - images/forge-builder-go-trixie/tests/smoke_no_apt_cache.sh

  - image: syft
    version: ">=0.1"
    expectations:
      - promise: files.syft-binary
        reason: The /syft binary is COPYed from this mirror stage into /usr/local/bin/syft of the builder runtime.
        preflight:
          - images/forge-builder-go-trixie/tests/smoke_has_syft.sh

      - promise: shape.zero-mod
        reason: mirror/syft must be a zero-mod passthrough — any downstream builder expects the exact upstream syft behavior, not a modified derivative.
        preflight:
          - images/forge-builder-go-trixie/tests/smoke_has_syft.sh
