# FG-012: externally-sourced image. Dockerfile + sources live in bboortz/beaconry.
# Forge's scripts/build-image.sh clones at the pinned ref, builds, scans,
# signs, publishes. depends_on captures the contract dep on python-scratch
# so EXPECTATIONS.yaml can reference its promises (FG-010).
tag: "0.1"
platforms:
  - linux/amd64
depends_on:
  - python-scratch-trixie
source:
  git: https://github.com/bboortz/beaconry
  # FG-013: daily cron tracks beaconry main HEAD; resolved sha baked into revision label.
  ref: "latest"
  dockerfile: poc/scout/Dockerfile
  context: poc
