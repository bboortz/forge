# FG-010 contract for github-runner-noble (FG-051).

spec_version: 1
image: github-runner-noble
version: "0.3"

promises:
  - id: runtime.gha-runner-binary
    description: "/home/runner/bin/Runner.Listener is present and `Runner.Listener --version` prints a v2.X.Y version string matching the resolved upstream actions/runner GitHub release at build time."
    caps: [image.github-runner-noble-pre-baked, build.ref-latest-release]
    tests:
      - images/github-runner-noble/tests/smoke_runner_version.sh

  - id: runtime.ci-toolset-full-bake
    description: "Pre-baked CI toolset: hadolint (v2.15.1+), terraform (1.17.2+), shellcheck, make, jq, unzip, python3, pip, git, curl, dumb-init. Every tool responds to --version (or -V where --version isn't supported)."
    caps: [image.github-runner-noble-pre-baked]
    tests:
      - images/github-runner-noble/tests/smoke_tools_present.sh

  - id: runtime.ansible-collections-preinstalled
    description: "Ansible is pre-installed via pip + the ansible-requirements.yml collections (ansible.posix + community.general) are pre-installed via ansible-galaxy. `ansible --version` + `ansible-galaxy collection list` both succeed and the collections appear."
    caps: [image.github-runner-noble-pre-baked]
    tests:
      - images/github-runner-noble/tests/smoke_ansible_collections.sh

  - id: runtime.entrypoint-registers-first-start
    description: "ENTRYPOINT /entrypoint.sh reads GITHUB_ORG / GITHUB_RUNNER_PAT / RUNNER_NAME / RUNNER_LABELS env, performs first-start registration against the GitHub org via config.sh --unattended, then execs run.sh. If /home/runner/.runner already exists, skips registration and goes directly to run.sh. If GITHUB_ORG is unset, exits nonzero with a clear error message (does NOT hang)."
    caps: [image.github-runner-noble-pre-baked]
    tests:
      - images/github-runner-noble/tests/smoke_entrypoint_env_validation.sh

  - id: runtime.runner-creds-dir-env
    description: "/entrypoint.sh reads RUNNER_CREDS_DIR env var (default /home/runner). When set to a non-default path, the entrypoint persists credentials in that directory via a two-phase scheme. Phase 1 (restart): if RUNNER_CREDS_DIR/.runner already exists, symlink each existing credential file (.runner, .credentials, .credentials_rsaparams) from /home/runner/ into RUNNER_CREDS_DIR BEFORE invoking config.sh / run.sh. Files that don't yet exist in RUNNER_CREDS_DIR get NO symlink (pre-creating a dangling symlink crashes Runner.Listener configure's LoadDefaultUserAgents() path with FileNotFoundException). Phase 2 (first-start post-config): after config.sh writes credentials into /home/runner/ natively, the entrypoint mv's each regular file into RUNNER_CREDS_DIR and replaces it with a symlink. Net effect: credentials persist in the narrow volume across container recreation; the runner binary tree under /home/runner/bin/ stays image-layer owned."
    caps: [image.github-runner-creds-dir]
    tests:
      - images/github-runner-noble/tests/smoke_runner_creds_dir.sh

  - id: presence.shell
    description: /bin/bash + /bin/sh are present (slim contract — CI jobs assume shell is available).
    caps: [image.has-shell]
    tests:
      - images/github-runner-noble/tests/smoke_tools_present.sh

  - id: scan.nonzero-accepted
    description: "Image carries a full apt + pip + ansible-galaxy package graph. grype will report Ubuntu + PyPI + Node (none in this image) ecosystem matches. Scan-baseline.json records the accepted set; PR scan-regression gate (FG-019) fails on new CRITICALs beyond the baseline."
    caps: [scan.regression-gate]
    tests:
      - images/github-runner-noble/tests/smoke_runner_version.sh
