# Image metadata consumed by scripts/{build,test,discover}-image(s).sh.
# `repo` is derived from the directory name (per FG-004) — do not add it back.
# Scratch runtime: interpreter + stdlib + libs + CA bundle + zoneinfo + pip.
# No shell, no apt, no dpkg db.
tag: "3.14"
platforms:
  - linux/amd64
# FG-005: this image derives from scratch-base-trixie via COPY --from=.
# scripts/build-image.sh honours depends_on by (re)building each dep first
# so local `make build IMAGE_DIR=python-scratch-trixie` works from a cold cache.
depends_on:
  - scratch-base-trixie
