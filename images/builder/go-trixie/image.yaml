# FG-046: shared Go builder base. `FROM ghcr.io/bboortz/forge-builder-go-trixie:0.1`
# in any from-Go-source image's builder stage. Sibling of FG-025's
# forge-builder-python-trixie (which is Debian + syft but no Go toolchain).
#
# FG-065: dogfoods go-slim-trixie (new FG-065 pre-builder) instead of
# FROMing golang:1.27-trixie upstream directly. Satisfies the
# `arch.language-family-image-pair` invariant.
#
# Not a runtime image — not published for `docker run` use. Daily cron
# rebuilds go-slim-trixie first (publish-pre-builders tier), then this
# image (publish-builders tier), so Go stdlib CVE fixes land within 24h
# of upstream release, propagating to every from-Go-source derivative.
repo: builder/go-trixie
tag: "0.1"
platforms:
  - linux/amd64
depends_on:
  - pre-builder/go-slim-trixie
  - mirror/syft
