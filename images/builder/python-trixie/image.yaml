# FG-025: shared builder image pre-loaded with apt-upgrade + CA certs +
# syft. Every Forge-native scratch image's builder stage FROMs this
# instead of python:3.14-slim-trixie, eliminating the per-image repetition
# of apt-get update / upgrade / syft install. Daily cron rebuilds this
# first; derivatives pull it as a FROM reference.
#
# FG-042: dogfoods python-slim-trixie (instead of python:3.14-slim-trixie upstream).
# FG-066: syft sourced via mirror/syft (previously docker.io/anchore/syft).
repo: builder/python-trixie
tag: "0.1"
platforms:
  - linux/amd64
depends_on:
  - pre-builder/python-slim-trixie
  - mirror/syft
