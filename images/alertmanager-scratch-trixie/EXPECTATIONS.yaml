spec_version: 1
image: alertmanager-scratch-trixie

dependencies:
  - image: scratch-base-trixie
    version: ">=0.2"
    expectations:
      - promise: files.dynamic-linker
        reason: prometheus-alertmanager binary's interp = /lib64/ld-linux-x86-64.so.2.
        preflight:
          - images/alertmanager-scratch-trixie/tests/smoke_binary_runs.sh

      - promise: files.core-glibc
        reason: alertmanager links against libc only; baseline supplies it.
        preflight:
          - images/alertmanager-scratch-trixie/tests/smoke_binary_runs.sh

      - promise: files.tls-stack
        reason: outbound HTTPS for every webhook receiver requires libssl + CA bundle.
        preflight:
          - images/alertmanager-scratch-trixie/tests/smoke_ssl_cert_env.sh

      - promise: identity.nobody
        reason: baseline /etc/passwd ships nobody at 65534 — USER + silences-dir ownership rely on it.
        preflight:
          - images/alertmanager-scratch-trixie/tests/smoke_user_nonroot.sh

      - promise: writable-dirs.tmp
        reason: alertmanager writes notification state to /tmp during delivery retries.
        preflight:
          - images/alertmanager-scratch-trixie/tests/smoke_healthy_endpoint.sh

      - promise: absence.shell
        reason: scratch-image contract.
        preflight:
          - images/alertmanager-scratch-trixie/tests/smoke_no_shell.sh
