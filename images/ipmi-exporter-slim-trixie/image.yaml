# Per FG-004: repo = dir name, tag = version. FG-050: tracks upstream's
# latest GitHub release via the build.ref-latest-release CAP (daily cron
# re-resolves). Publishes 2-tag family: :latest, :latest-amd64.
#
# Slim variant — NO `depends_on` (doesn't derive from scratch-base-trixie).
tag: "latest"
platforms:
  - linux/amd64

# FG-077: declare base/* dependency so publish-base tier runs before this
# consumer in publish-derivatives.
depends_on:
  - base/debian-slim-trixie
