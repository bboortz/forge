# FG-010 contract for go-slim-trixie (FG-065).
#
# Forge-rooted Go 1.27 toolchain slim base. Mirrors node-slim-trixie's
# shape with the Go toolchain preserved from the upstream golang:1.27-trixie.

spec_version: 1
image: go-slim-trixie
version: "0.1"

promises:
  - id: runtime.go-toolchain
    description: "/usr/local/go/bin/go is present + executable; `go version` prints go1.27.* (per upstream golang:1.27-trixie base)."
    caps: [build.go-slim-base]
    tests:
      - images/pre-builder/go-slim-trixie/tests/smoke_go_version.sh

  - id: files.ca-certificates
    description: /etc/ssl/certs/ca-certificates.crt is present. Downstream `go mod download` / outbound HTTPS calls work without re-apt-installing.
    caps: [build.go-slim-base]
    tests:
      - images/pre-builder/go-slim-trixie/tests/smoke_ca_bundle.sh

  - id: files.dumb-init
    description: /usr/bin/dumb-init is present. Available to downstream consumers that need proper PID 1 signal forwarding (symmetry with node-slim-trixie convention).
    caps: [build.go-slim-base]
    tests:
      - images/pre-builder/go-slim-trixie/tests/smoke_dumb_init.sh

  - id: apt.freshly-upgraded
    description: Image was built with `apt-get upgrade` applied against the Debian trixie-security snapshot. Any trixie-security backport released before BUILD_TIMESTAMP is included.
    caps: [build.go-slim-base]
    tests:
      - images/pre-builder/go-slim-trixie/tests/smoke_apt_upgraded.sh

  - id: apt.no-cache
    description: /var/lib/apt/lists/ carries no Packages/Release/InRelease files. Downstream Dockerfiles that apt-get install MUST re-run apt-get update first.
    caps: [build.go-slim-base]
    tests:
      - images/pre-builder/go-slim-trixie/tests/smoke_no_apt_cache.sh
    inverse: true

  - id: presence.shell
    description: /bin/sh + /bin/bash are present (slim contract). Downstream builders invoke shell scripts; runtime consumers have `docker exec -it <container> sh` access.
    caps: [image.has-shell]
    tests:
      - images/pre-builder/go-slim-trixie/tests/smoke_has_shell.sh

  - id: shape.size-budget
    description: Image size ≤ upstream golang:1.27-trixie × 1.1 (10% headroom for apt-upgrade + ca-certs + dumb-init).
    caps: [test.size-budget]
    tests:
      - images/pre-builder/go-slim-trixie/tests/smoke_size.sh

  - id: scan.nonzero-accepted
    description: "scan-baseline.json accepts a nonzero CRITICAL CVE list — slim images inherit Debian trixie's dpkg closure + the Go stdlib. PR scan-regression gate (FG-019) fails only on new CRITICALs beyond baseline."
    caps: [scan.regression-gate]
    tests:
      - images/pre-builder/go-slim-trixie/tests/smoke_go_version.sh
