# Authoritative contract for pre-builder/alpine-3.
#
# FG-079 Alpine OS family pre-builder. apk-upgraded + CA + dumb-init.
# Shell + apk kept.

spec_version: 1
image: alpine-3
version: "3.0"

promises:
  - id: files.ca-certificates
    description: /etc/ssl/certs/ca-certificates.crt present via `apk add ca-certificates` + `update-ca-certificates`. HTTPS resolves out of the box.
    caps: [arch.alpine-pre-builder]
    tests:
      - images/pre-builder/alpine-3/tests/smoke_ca_bundle.sh

  - id: files.dumb-init
    description: /usr/bin/dumb-init present + executable. Consumers that want PID-1 signal handling can `ENTRYPOINT ["/usr/bin/dumb-init", "--"]`.
    caps: [arch.alpine-pre-builder]
    tests:
      - images/pre-builder/alpine-3/tests/smoke_dumb_init.sh

  - id: apk.freshly-upgraded
    description: "apk upgrade --no-cache ran during build; no stale packages. (Parallel to Debian pre-builders' apt.freshly-upgraded.)"
    caps: [arch.alpine-pre-builder]
    tests:
      - images/pre-builder/alpine-3/tests/smoke_apk_upgraded.sh

  - id: apk.no-cache
    description: /var/cache/apk is empty — `--no-cache` kept apk indexes out of the final image.
    caps: [arch.alpine-pre-builder]
    tests:
      - images/pre-builder/alpine-3/tests/smoke_apk_no_cache.sh

  - id: presence.shell
    description: /bin/sh present (Alpine's busybox). Operators can docker exec -it <image> sh.
    caps: [arch.alpine-pre-builder]
    tests:
      - images/pre-builder/alpine-3/tests/smoke_shell.sh

  - id: shape.size-budget
    description: Image size ≤ upstream alpine:3 × 1.3 (30% headroom for apk-upgrade delta).
    caps: [arch.alpine-pre-builder]
    tests:
      - images/pre-builder/alpine-3/tests/smoke_size.sh
