# FG-010 contract for debian-slim-sid (FG-058).
#
# Companion to debian-slim-trixie. Same slim-base shape, rolling-release
# lineage.

spec_version: 1
image: debian-slim-sid
version: "0.1"

promises:
  - id: files.debian-sid
    description: "/etc/os-release reports NAME=Debian + VERSION_CODENAME=sid (or ID=debian + VERSION_ID absent — unstable release). Downstream consumers that pick this base get the rolling-release package set."
    caps: [build.debian-sid-base]
    tests:
      - images/pre-builder/debian-slim-sid/tests/smoke_is_sid.sh

  - id: files.ca-certificates
    description: /etc/ssl/certs/ca-certificates.crt is present (Debian ca-certificates package). Downstream curl / git / pip registry fetch works without re-apt-installing.
    caps: [build.debian-sid-base]
    tests:
      - images/pre-builder/debian-slim-sid/tests/smoke_ca_bundle.sh

  - id: apt.freshly-upgraded
    description: Image was built with `apt-get upgrade` applied against the sid snapshot. Any sid-security backport released before the image's BUILD_TIMESTAMP is included.
    caps: [build.debian-sid-base]
    tests:
      - images/pre-builder/debian-slim-sid/tests/smoke_apt_upgraded.sh

  - id: apt.no-cache
    description: /var/lib/apt/lists/ carries no Packages/Release/InRelease files. Downstream Dockerfiles that apt-get install MUST re-run apt-get update first.
    caps: [build.debian-sid-base]
    tests:
      - images/pre-builder/debian-slim-sid/tests/smoke_no_apt_cache.sh
    inverse: true

  - id: presence.shell
    description: /bin/sh + /bin/bash are present (slim contract). Downstream builders invoke shell scripts; runtime consumers have `docker exec -it <container> sh` access.
    caps: [image.has-shell]
    tests:
      - images/pre-builder/debian-slim-sid/tests/smoke_has_shell.sh

  - id: shape.size-budget
    description: Image size ≤ upstream debian:sid-slim × 1.3 (30% headroom — sid's apt-upgrade delta can be larger than trixie's as packages roll through).
    caps: [test.size-budget]
    tests:
      - images/pre-builder/debian-slim-sid/tests/smoke_size.sh

  - id: scan.nonzero-accepted
    description: "scan-baseline.json accepts a nonzero CRITICAL CVE list — sid is rolling-release; new CVEs frequently appear + get fixed within days. PR scan-regression gate (FG-019) fails only on new CRITICALs beyond baseline. Daily cron refreshes the baseline implicitly via rebuild."
    caps: [scan.regression-gate]
    tests:
      - images/pre-builder/debian-slim-sid/tests/smoke_is_sid.sh
