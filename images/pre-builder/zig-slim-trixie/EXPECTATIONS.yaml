# What zig-slim-trixie requires from its dependencies.
# FG-072: Zig has no Debian-based Docker Hub upstream, so this pre-builder
# FROMs debian-slim-trixie (not an upstream Zig image). One narrow Rule 6
# intra-tier exemption (`zig-slim-trixie` → `debian-slim-trixie`) in
# verify-dockerfile-conformance.py's _INTRA_LAYER_EXEMPTIONS. The
# ziglang.org tarball install layer runs on top of this Debian base.

spec_version: 1
image: zig-slim-trixie

dependencies:
  - image: pre-builder/debian-slim-trixie
    version: ">=0.1"
    expectations:
      - promise: files.ca-certificates
        reason: curl needs the CA trust store to fetch the Zig tarball from https://ziglang.org/download/<ver>/zig-x86_64-linux-<ver>.tar.xz. Pre-builder pre-installs ca-certificates so this image doesn't need to re-apt-install.
        preflight:
          - images/pre-builder/zig-slim-trixie/tests/smoke_ca_bundle.sh

      - promise: apt.freshly-upgraded
        reason: Pre-builder has already applied apt-get upgrade; this image inherits that + adds its own install of ca-certificates + curl + dumb-init + xz-utils on top.
        preflight:
          - images/pre-builder/zig-slim-trixie/tests/smoke_apt_upgraded.sh

      - promise: presence.shell
        reason: Zig tarball-install uses `set -eux` + `curl` + `sha256sum -c -` + `tar -xJf` + `ln -s` via /bin/sh. Pre-builder keeps shell for all downstream slim consumers.
        preflight:
          - images/pre-builder/zig-slim-trixie/tests/smoke_has_shell.sh
