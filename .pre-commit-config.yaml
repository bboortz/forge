repos:
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker
        files: ^images/.*/Dockerfile$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: \.(sh|bash)$

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        files: ^(\.github/.*\.ya?ml|images/.*/(PROMISES|EXPECTATIONS)\.yaml)$
        args: ["-d", "{extends: default, rules: {line-length: disable, document-start: disable, truthy: {check-keys: false}}}"]

  - repo: local
    hooks:
      - id: verify-sid-pins
        name: verify-sid-pins
        language: system
        entry: bash scripts/verify-sid-pins.sh
        pass_filenames: false
        files: ^images/.*/sid-pins/

      - id: verify-traceability
        name: verify-traceability
        language: system
        entry: bash scripts/verify-traceability.sh
        pass_filenames: false
        files: ^(docs/stories/|docs/plan/|docs/CAPABILITIES\.md|tests/acceptance/)

      - id: verify-contracts
        name: verify-contracts (FG-010)
        language: system
        entry: python3 scripts/verify-contracts.py
        pass_filenames: false
        files: ^(images/.*/PROMISES\.yaml|images/.*/EXPECTATIONS\.yaml|images/.*/tests/.*\.sh|images/.*/image\.yaml|docs/CAPABILITIES\.md)$

      - id: contracts-semver-check
        name: contracts-semver-check (FG-010)
        language: system
        entry: python3 scripts/contracts-semver-check.py
        files: ^images/.*/PROMISES\.yaml$

      - id: verify-image-dirs
        name: verify-image-dirs (FG-012)
        language: system
        entry: bash scripts/verify-image-dirs.sh
        pass_filenames: false
        files: ^images/.*/(image\.yaml|Dockerfile)$

      # FG-017: scope-aware pre-push. Typical 1-image PR is ~2-3 min (was ~15).
      # Lint stays full-repo (unscoped) so pre-push can't pass while CI fails
      # on an untouched file (homelab lesson). Full check-strict runs via
      # nightly cron on dev as the safety net.
      - id: make-check-smart-pre-push
        name: make check-smart-strict (pre-push, FG-017)
        language: system
        entry: bash -c 'make check-smart-strict'
        pass_filenames: false
        stages: [pre-push]
